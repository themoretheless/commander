[package]
name = "commander"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
image = { version = "0.25", features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
dirs = "6"
open = "5"
trash = "5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc = "0.2"
notify = "7"
jwalk = "0.8"
rayon = "1"
