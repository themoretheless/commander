[package]
name = "commander"
version = "0.2.0"
edition = "2024"
description = "Dual-pane file manager for macOS built with egui"
repository = "https://github.com/themoretheless/commander"
license = "MIT"
publish = false

[features]
default = []
visual-qa = ["eframe/glow"]

[lints.rust]
# The objc crate's macros probe `feature = "cargo-clippy"`; register the
# value so the expansion doesn't trip unexpected_cfgs in our crate.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }

[lints.clippy]
# Ratchet: style lints that were cleared in bulk stay cleared.
use_self = "warn"
redundant_pub_crate = "warn"
doc_markdown = "warn"

[dependencies]
eframe = "0.36"
egui = "0.36"
pulldown-cmark = { version = "0.13", default-features = false }
html5gum = "0.8"
roxmltree = "0.20"
encoding_rs = "0.8"
csv = "1.4"
egui_extras = { version = "0.36", features = ["file", "image", "svg", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
    "webp",
    "tiff",
] }
kamadak-exif = "=0.6.1"
dirs = "7"
open = "5"
trash = "5"
chrono = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
jwalk = "0.9"
rayon = "1"
regex = "1"
regex-automata = "0.4"
regex-syntax = "0.8"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
libc = "0.2"
blake3 = "1.8.7"
crc32fast = "1.5"
sha2 = "0.11.1"
fastcdc = "5"
flate2 = "1"
bzip2 = "0.6.1"
xz2 = { version = "0.1.7", features = ["static"] }
zstd = { version = "0.13.3", default-features = false }
tar = "0.4"
unicode-normalization = "0.1.25"
unicode-segmentation = "1"
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
rand = "0.8"
globset = { version = "0.4", default-features = false }
md-5 = "0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3", default-features = false }
