[package]
name = "commander"
version = "0.1.0"
edition = "2024"
description = "Dual-pane file manager for macOS built with egui"
repository = "https://github.com/themoretheless/commander"
license = "MIT"
publish = false

[features]
default = []
visual-qa = []

[lints.rust]
# The objc crate's macros probe `feature = "cargo-clippy"`; register the
# value so the expansion doesn't trip unexpected_cfgs in our crate.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }

[dependencies]
eframe = "0.35"
egui = "0.35"
egui_extras = { version = "0.35", features = ["all_loaders"] }
image = { version = "0.25", features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
dirs = "6"
open = "5"
trash = "5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc = "0.2"
notify = "8"
jwalk = "0.8"
rayon = "1"
regex = "1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
libc = "0.2"
blake3 = "1.8.4"
fastcdc = "4.0.1"
unicode-normalization = "0.1.25"
