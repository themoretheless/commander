name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo --locked fmt --check

      - name: Clippy
        run: cargo --locked clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo --locked test --all-targets --all-features

      - name: Native menu model contract
        run: cargo --locked test native_menu::model::tests -- --test-threads=1

      - name: Native release QA policy
        run: cargo --locked test native_release_qa::policy::tests -- --test-threads=1

      - name: Performance budget contract
        run: cargo --locked test measurement::tests::ci_performance_budget_contract_is_complete -- --exact

      - name: Performance smoke probes
        run: cargo --locked test measurement::tests::ci_runtime_smoke_probes_stay_within_budgets -- --exact --ignored --nocapture --test-threads=1

      - name: Workflow ergonomics
        run: cargo --locked test klm::tests::ci_core_workflows_stay_within_operator_budgets -- --exact

  visual-qa:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - desktop_base
          - minimum_window
          - zoom_200_accessible
          - confirmation_owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Native framebuffer visual QA
        run: cargo --locked run --features visual-qa -- --visual-qa ${{ matrix.scenario }} --output target/visual-qa

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commander-visual-qa-${{ matrix.scenario }}
          path: target/visual-qa/${{ matrix.scenario }}
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check advisory waiver expiry
        shell: bash
        env:
          RUSTSEC_2026_0192_OWNER: "@themoretheless"
          RUSTSEC_2026_0192_REVIEW: "2026-10-21"
          RUSTSEC_2026_0192_EXPIRES: "2026-10-28"
        run: |
          set -euo pipefail
          policy="owner=${RUSTSEC_2026_0192_OWNER}; review-by=${RUSTSEC_2026_0192_REVIEW}; expires=${RUSTSEC_2026_0192_EXPIRES}"
          grep --fixed-strings --quiet -- "$policy" deny.toml || {
            echo "::error::RUSTSEC-2026-0192 waiver metadata drifted from deny.toml"
            exit 1
          }

          now="$(date -u +%s)"
          review="$(date -u --date="${RUSTSEC_2026_0192_REVIEW}T00:00:00Z" +%s)"
          expires="$(date -u --date="${RUSTSEC_2026_0192_EXPIRES}T00:00:00Z" +%s)"
          if (( now >= expires )); then
            echo "::error::RUSTSEC-2026-0192 waiver expired; owner ${RUSTSEC_2026_0192_OWNER}"
            exit 1
          fi

          if (( now >= review )); then
            echo "::warning::RUSTSEC-2026-0192 waiver review is due; owner ${RUSTSEC_2026_0192_OWNER}"
          fi

      - name: Install cargo-deny
        shell: bash
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-deny"
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${asset}.tar.gz"

          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" "$url"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" \
            --strip-components=1 "${asset}/cargo-deny"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Enforce supply-chain policy
        shell: bash
        run: |
          test "$(cargo-deny --version)" = "cargo-deny 0.20.2"
          cargo-deny --all-features --locked check advisories bans licenses sources
