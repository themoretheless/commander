name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Performance budget contract
        run: cargo test measurement::tests::ci_performance_budget_contract_is_complete -- --exact

      - name: Performance smoke probes
        run: cargo test measurement::tests::ci_runtime_smoke_probes_stay_within_budgets -- --exact --nocapture

      - name: Workflow ergonomics
        run: cargo test klm::tests::ci_core_workflows_stay_within_operator_budgets -- --exact
