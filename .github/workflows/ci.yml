name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Native menu model contract
        run: cargo test native_menu::model::tests -- --test-threads=1

      - name: Native framebuffer visual QA
        timeout-minutes: 5
        run: cargo run --features visual-qa -- --visual-qa desktop_base --output target/visual-qa

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commander-visual-qa
          path: target/visual-qa
          if-no-files-found: error

      - name: Performance budget contract
        run: cargo test measurement::tests::ci_performance_budget_contract_is_complete -- --exact

      - name: Performance smoke probes
        run: cargo test measurement::tests::ci_runtime_smoke_probes_stay_within_budgets -- --exact --ignored --nocapture --test-threads=1

      - name: Workflow ergonomics
        run: cargo test klm::tests::ci_core_workflows_stay_within_operator_budgets -- --exact
